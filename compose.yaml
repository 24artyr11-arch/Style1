services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - wardrobe_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  wardrobe_data:
    name: ${WARDROBE_VOLUME_NAME:-style1_wardrobe_data}
    external: true
